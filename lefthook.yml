lefthook: go tool -modfile=tools/go.mod lefthook

pre-commit:
  jobs:
    - name: format
      glob: "*.go"
      run: go tool -modfile=tools/go.mod golangci-lint fmt --config=.golangci.yml {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.go"
      run: go tool -modfile=tools/go.mod golangci-lint run --config=.golangci.yml
